name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate runner script
        run: |
          bash -n run_all.sh
          bash run_all.sh --check
      - name: Run Ruff lint
        run: |
          ruff check .
      - name: Run Ruff format check
        run: |
          ruff format --check .
      - name: Run tests
        run: |
          pytest -q
      - name: Build package
        run: |
          python -m pip install build
          python -m build
      - name: Smoke test built wheel
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --upgrade pip
          /tmp/smoke-venv/bin/pip install dist/*.whl
          /tmp/smoke-venv/bin/python -c "import neurochip_ar; from neurochip_ar import LIFNeuron, RecurrentSpikingNetwork, PairSTDP, poisson_rate_encoder; print('Smoke import OK')"
          rm -rf /tmp/smoke-venv
